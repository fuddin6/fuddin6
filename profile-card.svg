<svg viewBox="0 0 800 450" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Tema Default / Light Mode */
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text-main: #24292f;
      --text-sub: #57606a;
      --accent: #0969da;
      --accent-light: #ddf4ff;
    }
    /* Dark Mode Otomatis */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text-main: #c9d1d9;
        --text-sub: #8b949e;
        --accent: #58a6ff;
        --accent-light: #1f6feb;
      }
    }
    .base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text-main); }
    .title { font-size: 24px; font-weight: 700; fill: var(--accent); }
    .subtitle { font-size: 15px; fill: var(--text-sub); }
    .tag { font-size: 12px; font-weight: 600; fill: var(--accent); }
    .card { fill: var(--card-bg); stroke: var(--border); stroke-width: 1; rx: 8; }
    
    /* Animasi Mengetik Halus */
    @keyframes blink { 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: var(--accent); }
  </style>

  <!-- Background Utama ala Browser -->
  <rect width="800" height="450" rx="12" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  
  <!-- Tombol Navigasi Mac Style -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="25" r="6" fill="#27c93f"/>
  
  <g class="base">
    <!-- BENTO BOX 1: Profil Utama (Kiri Atas) -->
    <rect x="20" y="55" width="460" height="180" class="card"/>
    <text x="50" y="105" class="title">Muhamad Nur Saifuddin</text>
    <text x="50" y="135" font-size="17" font-weight="600">UI/UX &amp; Front-End Developer</text>
    <text x="50" y="170" class="subtitle">Spesialis desain antarmuka interaktif &amp; Web3.</text>
    <text x="50" y="195" class="subtitle">Fokus pada estetika, logika, dan performa web_</text>
    <rect x="372" y="182" width="3" height="15" class="cursor" />

    <!-- BENTO BOX 2: Tech Stack (Kanan Atas) -->
    <rect x="500" y="55" width="280" height="180" class="card"/>
    <text x="530" y="95" font-size="16" font-weight="700">Tech &amp; Skills</text>
    <!-- Tag 1 -->
    <rect x="530" y="115" width="100" height="28" rx="14" fill="var(--accent-light)" opacity="0.3"/>
    <text x="550" y="133" class="tag">UI/UX Design</text>
    <!-- Tag 2 -->
    <rect x="640" y="115" width="110" height="28" rx="14" fill="var(--accent-light)" opacity="0.3"/>
    <text x="655" y="133" class="tag">Tailwind CSS</text>
    <!-- Tag 3 -->
    <rect x="530" y="155" width="90" height="28" rx="14" fill="var(--accent-light)" opacity="0.3"/>
    <text x="548" y="173" class="tag">Laravel</text>
    <!-- Tag 4 -->
    <rect x="630" y="155" width="120" height="28" rx="14" fill="var(--accent-light)" opacity="0.3"/>
    <text x="643" y="173" class="tag">Web3 Frontend</text>

    <!-- BENTO BOX 3: Highlight Project (Bawah Lengkap) -->
    <rect x="20" y="255" width="760" height="170" class="card"/>
    <text x="50" y="295" font-size="16" font-weight="700">🚀 Proyek &amp; Portofolio</text>
    
    <text x="50" y="330" font-size="16" font-weight="600" fill="var(--accent)">Personal Digital Portfolio</text>
    <text x="50" y="355" class="subtitle">Platform portofolio interaktif berbasis Cloudflare Workers untuk memamerkan desain &amp; project.</text>
    
    <text x="50" y="390" font-size="12" fill="var(--text-sub)">Tech used: HTML/CSS • JS • UI/UX Design • Cloudflare Workers</text>
  </g>
</svg>
