<svg viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Background Dark/Light Support -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <style>
    /* Light Mode */
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #2563eb;
      --tag-bg: #eff6ff;
      --tag-text: #1d4ed8;
      --badge-bg: #dcfce7;
      --badge-text: #15803d;
    }
    /* Dark Mode Otomatis */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text-main: #f0f6fc;
        --text-sub: #8b949e;
        --accent: #58a6ff;
        --tag-bg: #1f2937;
        --tag-text: #60a5fa;
        --badge-bg: #14532d;
        --badge-text: #4ade80;
      }
    }

    .base { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: var(--text-main); }
    .card { fill: var(--card-bg); stroke: var(--border); stroke-width: 1.5; rx: 12; }
    .title { font-size: 22px; font-weight: 800; fill: var(--text-main); }
    .subtitle { font-size: 14px; fill: var(--text-sub); line-height: 1.5; }
    .tag-box { fill: var(--tag-bg); rx: 6; }
    .tag-text { font-size: 11px; font-weight: 600; fill: var(--tag-text); }
    
    /* Animasi Cursor & Status Pulse */
    @keyframes blink { 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: var(--accent); }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-dot { animation: pulse 2s infinite; transform-origin: center; }
  </style>

  <!-- Canvas Utama ala Frame Window -->
  <rect width="800" height="480" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  
  <!-- Header Browser / macOS Controls -->
  <circle cx="28" cy="24" r="5.5" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="5.5" fill="#27c93f"/>
  <text x="400" y="28" font-size="12" font-weight="600" fill="var(--text-sub)" text-anchor="middle" class="base">saifuddin.dev — Profile Workspace</text>

  <g class="base">
    <!-- BENTO 1: Profile & Headline (Kiri Atas) -->
    <rect x="20" y="50" width="480" height="210" class="card"/>
    
    <!-- Status Badge "Available for Work" -->
    <rect x="42" y="72" width="135" height="24" rx="12" fill="var(--badge-bg)"/>
    <circle cx="56" cy="84" r="4" fill="var(--badge-text)" class="pulse-dot"/>
    <text x="68" y="88" font-size="11" font-weight="700" fill="var(--badge-text)">Open to Projects</text>

    <text x="42" y="125" class="title">Muhamad Nur Saifuddin</text>
    <text x="42" y="148" font-size="15" font-weight="600" fill="var(--accent)">UI/UX Designer • Web Developer • IT Support</text>
    
    <text x="42" y="180" class="subtitle">Membangun antarmuka intuitif &amp; sistem web terstruktur</text>
    <text x="42" y="202" class="subtitle">dengan arsitektur MVC dan fokus pada User Experience_</text>
    <rect x="375" y="190" width="2.5" height="14" class="cursor"/>

    <!-- BENTO 2: Tech Stack Grid (Kanan Atas) -->
    <rect x="515" y="50" width="265" height="210" class="card"/>
    <text x="535" y="82" font-size="14" font-weight="700">🛠️ Tech &amp; Tools</text>

    <!-- Row 1 -->
    <rect x="535" y="98" width="60" height="24" class="tag-box"/><text x="565" y="114" class="tag-text" text-anchor="middle">Figma</text>
    <rect x="603" y="98" width="80" height="24" class="tag-box"/><text x="643" y="114" class="tag-text" text-anchor="middle">VS Code</text>
    <rect x="691" y="98" width="65" height="24" class="tag-box"/><text x="723" y="114" class="tag-text" text-anchor="middle">Canva</text>

    <!-- Row 2 -->
    <rect x="535" y="130" width="60" height="24" class="tag-box"/><text x="565" y="146" class="tag-text" text-anchor="middle">HTML5</text>
    <rect x="603" y="130" width="55" height="24" class="tag-box"/><text x="630" y="146" class="tag-text" text-anchor="middle">CSS3</text>
    <rect x="666" y="130" width="90" height="24" class="tag-box"/><text x="711" y="146" class="tag-text" text-anchor="middle">JavaScript</text>

    <!-- Row 3 -->
    <rect x="535" y="162" width="55" height="24" class="tag-box"/><text x="562" y="178" class="tag-text" text-anchor="middle">PHP</text>
    <rect x="598" y="162" width="65" height="24" class="tag-box"/><text x="630" y="178" class="tag-text" text-anchor="middle">MySQL</text>
    <rect x="671" y="162" width="85" height="24" class="tag-box"/><text x="713" y="178" class="tag-text" text-anchor="middle">MVC Pattern</text>

    <!-- Row 4 -->
    <rect x="535" y="194" width="115" height="24" class="tag-box"/><text x="592" y="210" class="tag-text" text-anchor="middle">CodeIgniter 3</text>

    <!-- BENTO 3: Featured Project (Bawah Lengkap) -->
    <rect x="20" y="275" width="760" height="185" class="card"/>
    <text x="42" y="310" font-size="14" font-weight="700">🚀 Featured Project</text>
    
    <text x="42" y="342" font-size="17" font-weight="700" fill="var(--accent)">Sistem Manajemen Reservasi Kunjungan</text>
    <text x="42" y="368" class="subtitle">Platform berbasi web yang dirancang untuk memanajemen data tamu, jadwal kunjungan,</text>
    <text x="42" y="388" class="subtitle">serta alur alokasi reservasi secara efisien dan terstruktur.</text>
    
    <!-- Divider Line -->
    <line x1="42" y1="410" x2="738" y2="410" stroke="var(--border)" stroke-width="1"/>

    <text x="42" y="435" font-size="12" font-weight="600" fill="var(--text-sub)">Stack: CodeIgniter 3 • PHP • MySQL • HTML/CSS • JavaScript</text>
  </g>
</svg>
